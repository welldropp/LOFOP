[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lofop"
version = "1.2.1"
description = "LOFOP: a modular, enterprise-grade computer vision framework."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "DURGAMANI SASIKUMAR" },
    { name = "Nishanandhini A. (Assistant Professor)" },
]
maintainers = [{ name = "LOFOP Contributors" }]
keywords = ["computer-vision", "deep-learning", "object-detection", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "PyYAML>=6.0",
    "pillow>=10.0",
]

[project.scripts]
lofop = "lofop.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "build>=1.0",
    "twine>=5.0",
]
rich = [
    "rich>=13.0",
]
models = [
    "torch>=2.0",
]
deploy = [
    "onnx>=1.15",
    "onnxruntime>=1.17",
]
tensorrt = [
    "tensorrt>=8.6",
    "numpy>=1.23",
]
all = [
    "rich>=13.0",
    "torch>=2.0",
    "onnx>=1.15",
    "onnxruntime>=1.17",
]

[project.urls]
Homepage = "https://github.com/tedo001/LOFOP"
Repository = "https://github.com/tedo001/LOFOP"
Documentation = "https://github.com/tedo001/LOFOP/blob/main/MANUAL.md"
Issues = "https://github.com/tedo001/LOFOP/issues"

[project.entry-points."lofop.plugins"]
# Built-in plugins register here as the framework grows.

[tool.setuptools.packages.find]
include = ["lofop*"]

[tool.setuptools.package-data]
lofop = ["csrc/*.cpp", "csrc/*.cu", "configs/lofop-detect/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["lofop"]
branch = true

[tool.coverage.report]
show_missing = true
# Hardware/optional paths that CI cannot exercise (TensorRT engines need an
# NVIDIA GPU; some native-ops build branches are compiler/OS specific) keep the
# reachable ceiling below 100, so the floor is set with headroom below the
# measured ~90%.
fail_under = 85
omit = [
    "lofop/deploy/tensorrt_export.py",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
