# SwiftNet nano + NMS-free query head: the leanest end-to-end variant.
extends: [q-base.yaml]

model:
  backbone:
    type: backbone/SwiftNet
    widths: [24, 48, 96, 192]
    depths: [1, 2, 2, 1]
    expansion: 4.0
  neck:
    in_channels: [48, 96, 192]
    width: 64
  head:
    width: 64
    feedforward: 128
