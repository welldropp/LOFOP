name: ci

# Runs lint and the full test suite on every push to the main branches and on
# every pull request, so nothing broken can be merged and the package stays
# releasable at all times.

on:
  push:
    branches: [main, tedo]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install "ruff>=0.4"
      - name: Lint
        run: ruff check lofop tests benchmarks examples scripts
      - name: Check version consistency
        run: python scripts/check_version_sync.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install LOFOP with test extras
        run: python -m pip install -e ".[dev,models,deploy]"
      - name: Build native C++ ops
        run: python -c "from lofop.ops import build_native, backend; build_native(); print('ops backend:', backend())"
      - name: Run tests
        run: python -m pytest tests/ -q

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install LOFOP with test extras
        run: python -m pip install -e ".[dev,models,deploy]"
      - name: Build native C++ ops
        run: python -c "from lofop.ops import build_native; build_native()"
      - name: Run tests with coverage (fails under the configured floor)
        run: python -m pytest tests/ --cov --cov-report=term-missing

  # The C++ SDK builds and tests on every platform LOFOP supports, with no
  # ONNX Runtime: the pipeline it implements (preprocessing, decoding,
  # suppression, coordinate mapping) is exercised through a stub engine, so a
  # regression is caught without a model or a GPU in CI.
  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
